# vim: set ft=tmux

# set is short for set-option
# -g = global
# -s = server / session
# -u = unsets session to inherit global, or resets global to default with -g
# -o = prevents resetting an already set value
# -a = appends to current value

# set -g default-terminal "screen-256color"  # tmux-256color breaks C-L (clear screen)
set -g default-terminal "tmux-256color"  # https://github.com/tmux/tmux/issues/1257#issuecomment-581378716
set -as terminal-overrides ",gnome*:Tc"
# set-option -ga terminal-overrides ',xterm-256color:Tc'
set -as terminal-overrides ",wezterm*:Tc"

set -as terminal-overrides ",*:U8=0"
# set-option -sa terminal-overrides ',xterm-256color:RGB'  # As per the 'checkhealth' warning generated by neovim
set-option -ga terminal-overrides ",tmux-256color:Tc,xterm-256color:Tc" # https://github.com/gruvbox-community/gruvbox/wiki/Terminal-specific


## Set the default shell to whatever the current shell is
set-option -g default-shell $SHELL

setw -g xterm-keys on

set-option -g allow-rename off
# set -g status-bg cyan
# set -g status-bg white

set -g status-style fg=white,bg=colour234
set -g window-status-activity-style bold
set -g pane-border-style fg=colour245
set -g pane-active-border-style fg=colour39
set -g message-style fg=colour16,bg='#e7e7e7',bold

# set -g status-right '#[fg=colour234,bg=colour252,bold] #H #[fg=colour235,bg=colour252,bold]'
# set -g status-left '#[fg=colour235,bg=colour252,bold] #S #[fg=colour252,bg=colour238,nobold]#[fg=colour245,bg=colour238,bold] #(whoami) #[fg=colour238,bg=colour234,nobold]'
# set -g window-status-format "#[fg=colour244,bg=colour234,nobold,noitalics,nounderscore] #I #[fg=colour240,bg=colour234,nobold,noitalics,nounderscore]  #[default]#W "
# set -g window-status-current-format "#[fg=colour234,bg=colour63,nobold,noitalics,nounderscore] #[fg=colour117,bg=colour63,nobold,noitalics,nounderscore]#I  #[fg=colour231,bg=colour63,bold,noitalics,nounderscore]#W #[fg=colour63,bg=colour234,nobold,noitalics,nounderscore] "

set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# default window title colors
# https://github.com/tony/tmux-config/blob/master/.tmux.conf
# set-window-option -g window-status-style fg=colour244,bg=default,dim # fg=base0
# default window title colors
set-window-option -g window-status-style fg=colour244,bg=default,dim # fg=base0

# active window title colors
# set-window-option -g window-status-current-style fg=colour166,bg=default,bright # fg=orange
set-window-option -g window-status-current-style fg=white,bg=default,bright # fg=orange

# pane border
set-option -g pane-border-style fg=colour235 #fg=base02
set-option -g pane-active-border-style fg=colour240 #fg=base01

# message text
set-option -g message-style bg=colour235,fg=colour166 # bg=base02, fg=orange

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange
# clock
set-window-option -g clock-mode-colour green #green



# Scott Simpson
# set-option -g prefix C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# https://github.com/tony/tmux-config/blob/master/.tmux.conf
# Allows us to use C-a a <command> to send commands to a TMUX session inside
# another TMUX session
bind-key a send-prefix

bind-key C command-prompt -p "Name of new window: " "new-window -n '%%'"

set -q -g status-utf8 on  # expect UTF-8 (tmux < 2.2)
setw -q -g utf8 on


# More intuitive pane splitting key-bindings, open all in current path
bind c new-window -c "#{pane_current_path}"
bind C new-window
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# bind-key u capture-pane \; save-buffer /tmp/tmux-buffer \; new-window -n "urlview" '$SHELL -c "urlview < /tmp/tmux-buffer"'
bind-key u capture-pane \; save-buffer /tmp/tmux-buffer \; new-window -n "urlscan" '$SHELL -c "urlview < /tmp/tmux-buffer"'

set -g history-limit 100000  # give us even bigger history than tmux-sensible

# bind-key m set-option -g mouse on \; display 'Mouse: ON'
# bind-key M set-option -g mouse off \; display 'Mouse: OFF'
bind-key m set-option -g mouse \; display "Mouse: #{?mouse,ON,OFF}"
set -g mouse off

set -g set-clipboard external
set -as terminal-overrides ',xterm-256color:Ms=\E]52;%p1%s;%p2%s\007'

# # unbind p
# # bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel -i -p && xsel -o -p | xsel -i -b"
# # bind-key p run "xsel -o | tmux load-buffer - ; tmux paste-buffer"
#
# # https://github.com/yuweijun/tmux/blob/8712e218c283d83b2411de954b9f109c5da08c4d/tmux.linux.conf
# # Setup 'v' to begin selection as in Vim
# bind-key -Tcopy-mode-vi 'v' send -X begin-selection
# # move tmux copy buffer into x clipboard
# bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
#
# # Update default binding of `Enter` to also use copy-pipe
# unbind -Tcopy-mode-vi Enter
# bind-key -Tcopy-mode-vi Enter send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

unbind p
bind p paste-buffer

set -sg escape-time 10                    # faster command sequences
set -sg repeat-time 600                   # increase repeat timeout
set -sg focus-events on
# set-option -g focus-events on

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
# super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# resize panes like vim
# feel free to change the "1" to however many lines you want to resize by, only
# one at a time can be slow
bind < resize-pane -L 10
bind > resize-pane -R 10
bind - resize-pane -D 10
bind + resize-pane -U 10

# soften status bar color from harsh green to light gray
# set -g status.-bg '#666666'
# set -g status-fg '#aaaaaa'

# # remove administrative debris (session name, hostname, time) in status bar
set -g status-left ''
set -g status-right ''

# set -g status-left-length 20
# set -g status-right-length 20

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename off   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

bind-key b break-pane -d

# set -g set-titles on          # set terminal title
set -g set-titles off

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 2000      # slightly longer status messages display time

set -g status-interval 10     # redraw status line every 10 seconds

# https://github.com/tony/tmux-config/blob/master/.tmux.conf
# set -g status-justify centre # center align window list

# set only on OS X where it's required
# set -g default-command "reattach-to-user-namespace -l $SHELL"

# use vim movement for copy mode
setw -g mode-keys vi

# emacs key bindings in tmux command prompt (prefix + :) are better than
# vi keys, even for vim users
set -g status-keys emacs

# clear both screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.1' \; clear-history

# activity
set -g monitor-activity on
set -g visual-activity off

setw -g alternate-screen on  # default, restore previous contents when exiting interactive app
set -g bell-action none
set -g visual-bell off


# bind h select-pane -L
# bind j select-pane -D
# bind k select-pane -U
# bind l select-pane -R

# -n flag facilitates without prefix
bind-key C-h select-pane -L
bind-key C-j select-pane -D
bind-key C-k select-pane -U
bind-key C-l select-pane -R

# https://arcolinux.com/everthing-you-need-to-know-about-tmux-configuration/
# remember tmux reuses backend server process which doesn't go down unless you do 'tmux kill-server' (killing tmux server process is an easy reset if you don't want to undo options you've been messing with interactively)
# bind r source ~/.tmux.conf\\; display "~/.tmux.conf sourced!"
bind r source-file ~/.tmux.conf \; display ".tmux.conf reloaded"

# # https://github.com/nerdo/tmux-configuration/blob/master/keys.conf
# ## Copy selection on drag end event, but do not cancel copy mode and do not clear selection
# ## clear select on subsequence mouse click
# unbind MouseDragEnd1Pane
# bind -T copy-mode-vi MouseDragEnd1Pane \
# send-keys -X copy-pipe "$yank"
# # bind -T copy-mode-vi MouseDown1Pane select-pane \;\
# send-keys -X clear-selection

bind -Tcopy-mode-vi C-j               send -X copy-pipe-and-cancel 'xsel -i'
bind -Tcopy-mode-vi Enter             send -X copy-pipe-and-cancel 'xsel -i'
bind -Tcopy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xsel -i'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'jatap/tmux-base16-statusline'
# set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'wfxr/tmux-power'

# set -g status-right 'Continuum status: #{continuum_status}'
# set -g @continuum-restore 'on'
# set -g @base16-statusline 'main'

bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "send-keys C-l"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# download TPM like so before launching/reloading tmux:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# run '~/.tmux/plugins/tpm/tpm'
run '~/.config/tmux/tpm/tpm'

# vim: set ft=tmux
